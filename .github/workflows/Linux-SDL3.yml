name: CI Linux (SDL3)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-sdl3: # Compile check for the SDL3 drivers (--enable-sdl3)
    runs-on: ubuntu-latest
    steps:
      - name: Dependencies
        run: |
          sudo apt-get update -y
          # RetroArch's own build dependencies. SDL3's are installed by
          # the setup-sdl step below.
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libfreetype6-dev libx11-xcb-dev libavcodec-dev libxml2-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SDL3
        # Builds SDL3 from source and installs its own Linux build
        # dependencies. The action caches the built package itself,
        # keyed on the requested version and the runner os/arch, so
        # subsequent runs restore it instead of rebuilding. It also
        # exports PKG_CONFIG_PATH, which is what configure and make
        # both resolve sdl3 through.
        uses: libsdl-org/setup-sdl@v1
        with:
          version: 3.4.12
          build-type: Release
          install-linux-dependencies: true

      - name: Configure
        run: |
          ./configure --enable-sdl3
          # configure exits 0 even when a lib is missing; make sure
          # SDL3 was actually picked up.
          grep -q '^HAVE_SDL3 = 1' config.mk

      - name: Build
        run: make -j$(getconf _NPROCESSORS_ONLN)
